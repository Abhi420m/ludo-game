<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- 4-Quadrant Emblem -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Red Quad -->
    <path d="M-150,0 A150,150 0 0,0 0,150 L0,0 Z" fill="#ef4444"/>
    <!-- Blue Quad -->
    <path d="M0,150 A150,150 0 0,0 150,0 L0,0 Z" fill="#3b82f6"/>
    <!-- Yellow Quad -->
    <path d="M150,0 A150,150 0 0,0 0,-150 L0,0 Z" fill="#f59e0b"/>
    <!-- Green Quad -->
    <path d="M0,-150 A150,150 0 0,0 -150,0 L0,0 Z" fill="#10b981"/>

    <!-- Gold Central Ring -->
    <circle r="65" fill="#f8fafc" stroke="#f59e0b" stroke-width="8"/>
    
    <!-- Gold 3D Dice -->
    <rect x="-32" y="-32" width="64" height="64" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
    <!-- 6 Pips -->
    <circle cx="-16" cy="-18" r="5" fill="#ef4444"/>
    <circle cx="-16" cy="0" r="5" fill="#0f172a"/>
    <circle cx="-16" cy="18" r="5" fill="#0f172a"/>
    <circle cx="16" cy="-18" r="5" fill="#0f172a"/>
    <circle cx="16" cy="0" r="5" fill="#0f172a"/>
    <circle cx="16" cy="18" r="5" fill="#ef4444"/>
  </g>
</svg>

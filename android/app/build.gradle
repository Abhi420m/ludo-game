plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ludopro.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.ludopro.game"
        minSdk 21
        targetSdk 34
        versionCode 13
        versionName "1.1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.7.1'
}

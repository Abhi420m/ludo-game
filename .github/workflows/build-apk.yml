name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          ./gradlew :app:assembleDebug --stacktrace --info 2>&1 | tee ../gradle_build.log

      - name: Push Build Log to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          cp gradle_build.log build.txt 2>/dev/null || echo "No log generated" > build.txt
          git add build.txt
          git commit -m "Auto: build log" || true
          git push -f origin build-log || true

      - name: Prepare APK Release Binary
        run: |
          mkdir -p release-apk
          APK_FOUND=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FOUND"
          cp "$APK_FOUND" release-apk/Super-Ludo-Pro.apk
          ls -la release-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Super-Ludo-Pro-APK
          path: release-apk/Super-Ludo-Pro.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-apk/Super-Ludo-Pro.apk
          name: Super Ludo Pro ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

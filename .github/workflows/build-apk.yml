name: Build Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: |
          cd android
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          gradle :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee build_output.log || {
            echo "### ❌ Gradle Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }
          echo "### ✅ Gradle Build Succeeded!" >> $GITHUB_STEP_SUMMARY

      - name: Locate APK
        run: |
          find android/app/build/outputs/ -type f -name "*.apk" -ls || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Super-Ludo-Pro-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
